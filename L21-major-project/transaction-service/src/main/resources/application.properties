server.port=8083
spring.application.name=transaction-service
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [requestId=%X{requestId}] %msg%n

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${random.value}


spring.datasource.url=jdbc:mysql://localhost:3306/txndb
spring.datasource.username=user1
spring.datasource.password=Pass@123
spring.datasource.dbcp2.max-wait-millis=30000
spring.datasource.dbcp2.validation-query=/* ping */ select 1
spring.datasource.dbcp2.validation-query-timeout=30
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.id.new_generator_mappings=true
spring.jpa.show-sql=true


txn.init.topic=TXN-INIT
txn.completed.topic=TXN-COMPLETED
kafka.bootstrapAddress=localhost:9092,localhost:9093
